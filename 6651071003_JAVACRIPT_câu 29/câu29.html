
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>Return first and last name from a form</title>
    <!-- Liên kết đến file CSS trong thư mục Styles -->
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>

    <div class="container">
        <h2>Lấy giá trị Họ và Tên từ Form</h2>
        
        <!-- Form với sự kiện onsubmit gọi hàm getFormvalue()[cite: 13] -->
        <form id="form1" onsubmit="getFormvalue(event)">
            First name: <input type="text" name="fname" value="David"><br><br>
            Last name: <input type="text" name="lname" value="Beckham"><br><br>
            <input type="submit" value="Submit">
        </form>

        <div id="result-text"></div>
    </div>

    <!-- Liên kết đến file JavaScript trong thư mục Scripts -->
    <script src="Scripts/script.js"></script>
</body>
</html>
