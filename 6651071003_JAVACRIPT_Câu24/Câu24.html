<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 24 - Xuất thứ trong tuần</title>
    <!-- Liên kết đến file CSS trong thư mục Styles -->
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>

    <div class="container">
        <h2>Bài tập JavaScript - Câu 24</h2>
        
        <div class="form-group">
            <label>Ngày</label>
            <input type="number" id="txtDay" value="12" min="1" max="31">
            
            <label>Tháng</label>
            <select id="selectMonth">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
            </select>
            
            <label>Năm</label>
            <input type="number" id="txtYear" value="2015">
        </div>

        <div class="button-group">
            <button onclick="xuatThu()">Xuất thứ</button>
        </div>

        <div class="result-box">
            <div id="result"></div>
        </div>
    </div>

    <!-- Liên kết đến file JavaScript trong thư mục Scripts -->
    <script src="Scripts/script.js"></script>
</body>
</html>
