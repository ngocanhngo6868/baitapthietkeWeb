<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 22 - Nhân chia hai số</title>
    <!-- Liên kết đến file CSS trong thư mục Styles -->
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>

    <div class="container">
        <h2>Bài tập JavaScript - Câu 22</h2>
        
        <div class="form-group">
            <label for="num1">1st Number :</label>
            <input type="number" id="num1" value="">
        </div>
        
        <div class="form-group">
            <label for="num2">2nd Number:</label>
            <input type="number" id="num2" value="">
        </div>

        <div class="button-group">
            <!-- Nút Multiply và Divide -->
            <button id="btnMultiply" onclick="multiplyNumbers()">Multiply</button>
            <button id="btnDivide" onclick="divideNumbers()">Divide</button>
        </div>

        <div class="result-box">
            <p>The Result Is :</p>
            <div id="result"></div>
        </div>
    </div>

    <!-- Liên kết đến file JavaScript trong thư mục Scripts -->
    <script src="Scripts/script.js"></script>
</body>
</html>
